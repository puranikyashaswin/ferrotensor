[package]
name = "ferrotensor-trainer"
version = "0.1.0"
edition = "2021"
description = "Optimizers, LoRA fine-tuning and training loops for Ferrotensor"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/puranikyashaswin/ferrotensor"
documentation = "https://docs.rs/ferrotensor-trainer"
readme = "../README.md"
keywords = ["lora", "fine-tuning", "training", "machine-learning", "gpu"]
categories = ["science", "algorithms"]

[dependencies]
ferrotensor-backend = { path = "../ferrotensor-backend", version = "0.1.0" }
ferrotensor-autograd = { path = "../ferrotensor-autograd", version = "0.1.0" }
ferrotensor-graph = { path = "../ferrotensor-graph", version = "0.1.0" }
ferrotensor-loader = { path = "../ferrotensor-loader", version = "0.1.0" }
safetensors = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
half = "2"
