[package]
name = "ferrotensor"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GPU-accelerated machine learning library for training and inference in Rust"
documentation = "https://docs.rs/ferrotensor"
homepage = "https://github.com/puranikyashaswin/ferrotensor"
readme = "../README.md"
keywords = ["machine-learning", "deep-learning", "gpu", "neural-networks", "transformer"]
categories = ["science::ml", "algorithms"]

[dependencies]
# Internal crates
ferrotensor-backend = { path = "../ferrotensor-backend", version = "0.1.0" }
ferrotensor-autograd = { path = "../ferrotensor-autograd", version = "0.1.0" }
ferrotensor-graph = { path = "../ferrotensor-graph", version = "0.1.0" }
ferrotensor-trainer = { path = "../ferrotensor-trainer", version = "0.1.0" }
ferrotensor-loader = { path = "../ferrotensor-loader", version = "0.1.0" }

# GPU Backend
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.18", features = ["derive"] }

# Model Loading
memmap2 = "0.9"
safetensors = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"

# Utilities
rand = "0.8"
log = "0.4"

[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }
env_logger = "0.11"
criterion = "0.5"

[features]
default = ["metal"]
metal = []
vulkan = []

# Examples
[[example]]
name = "basic_tensor"
path = "examples/basic_tensor.rs"

[[example]]
name = "flash_attention"
path = "examples/flash_attention.rs"

[[example]]
name = "lora_finetune"
path = "examples/lora_finetune.rs"
