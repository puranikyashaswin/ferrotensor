[package]
name = "ferrotensor"
version = "0.3.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GPU-accelerated machine learning library for training and inference in Rust"
documentation = "https://docs.rs/ferrotensor"
homepage = "https://github.com/puranikyashaswin/ferrotensor"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "gpu", "neural-networks", "transformer"]
categories = ["science", "algorithms"]

[dependencies]
# GPU Backend
wgpu = "0.19"
pollster = "0.3"
bytemuck = "1.18"

# Model Loading
safetensors = "0.4"

# Error Handling
thiserror = "2.0"

# Utilities
rand = "0.8"

[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }
