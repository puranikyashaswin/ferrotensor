[package]
name = "ferrotensor-autograd"
version = "0.7.3"
edition = "2021"
description = "Reverse-mode automatic differentiation for the Ferrotensor GPU ML framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/ferrotensor-autograd"
readme = "README.md"
keywords = ["autograd", "autodiff", "machine-learning", "gpu", "wgpu"]
categories = ["science", "algorithms", "artificial-intelligence"]

[dependencies]
ferrotensor-backend = { path = "../ferrotensor-backend", version = "0.7.3" }
serde = { version = "1.0", features = ["derive"] }
pollster = "0.3"

[lints]
workspace = true
