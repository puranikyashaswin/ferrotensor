[package]
name = "ferrotensor-benchmarks"
version = "0.7.2"
edition = "2021"
description = "Benchmarks for the Ferrotensor GPU ML framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
documentation = "https://docs.rs/ferrotensor-benchmarks"
readme = "README.md"
keywords = ["benchmark", "machine-learning", "gpu", "wgpu", "performance"]
categories = ["science"]
default-run = "bench"

[lib]
name = "ferrotensor_benchmarks"
path = "src/lib.rs"
bench = false

[[bin]]
name = "bench"
path = "src/main.rs"
bench = false

[[bin]]
name = "tensor-api"
path = "src/bin/tensor_api.rs"
bench = false

[[bin]]
name = "matmul-tune"
path = "src/bin/matmul_tune.rs"
bench = false

[[bench]]
name = "gpu"
path = "benches/gpu.rs"
harness = false

[dependencies]
ferrotensor = { path = "../ferrotensor", version = "0.7.2" }
ferrotensor-backend = { path = "../ferrotensor-backend", version = "0.7.2" }
pollster = "0.3"
wgpu = "=30.0.2"
rand = "0.8"

[lints]
workspace = true
