[package]
name = "ferrotensor-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Benchmarks for the Ferrotensor GPU ML framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
homepage = "https://github.com/puranikyashaswin/ferrotensor"
documentation = "https://docs.rs/ferrotensor-benchmarks"
readme = "../README.md"
keywords = ["benchmark", "machine-learning", "gpu", "wgpu", "performance"]
categories = ["science"]
default-run = "bench"

[lib]
name = "ferrotensor_benchmarks"
path = "src/lib.rs"
bench = false

[[bin]]
name = "bench"
path = "src/main.rs"
bench = false

[[bench]]
name = "gpu"
path = "benches/gpu.rs"
harness = false

[dependencies]
ferrotensor-backend = { path = "../ferrotensor-backend", version = "0.1.0" }
pollster = "0.3"
wgpu = "0.19"
