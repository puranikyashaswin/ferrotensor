[package]
name = "rusty-hub"
version = "0.1.0"
edition = "2021"
description = "HuggingFace Hub integration for the Rusty ML framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/puranikyashaswin/rusty"
documentation = "https://docs.rs/rusty-hub"
readme = "../README.md"
keywords = ["huggingface", "machine-learning", "models", "download", "safetensors"]
categories = ["science", "algorithms"]

[dependencies]
rusty-backend = { path = "../rusty-backend", version = "0.1.0" }
rusty-graph = { path = "../rusty-graph", version = "0.1.0" }
rusty-loader = { path = "../rusty-loader", version = "0.1.0" }
rusty-autograd = { path = "../rusty-autograd", version = "0.1.0" }

# Use existing workspace dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
