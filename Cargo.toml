[workspace]
members = [
    "ferrotensor",
    "ferrotensor-loader",
    "ferrotensor-graph",
    "ferrotensor-backend",
    "ferrotensor-cli",
    "ferrotensor-autograd",
    "ferrotensor-trainer",
    "ferrotensor-hub",
    "benchmarks",
    "ferrotensor-monitor",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/puranikyashaswin/ferrotensor"
authors = ["Yashaswin Puranik <puranikyashaswinsharma@gmail.com>"]
rust-version = "1.88"
homepage = "https://github.com/puranikyashaswin/ferrotensor"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
