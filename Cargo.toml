[workspace]
members = [
    "ferrotensor",
    "ferrotensor-loader",
    "ferrotensor-graph",
    "ferrotensor-backend",
    "ferrotensor-cli",
    "ferrotensor-autograd",
    "ferrotensor-trainer",
    "ferrotensor-hub",
    "benchmarks",
    "ferrotensor-monitor",
    "ferrotensor-py",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.7.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/puranikyashaswin/ferrotensor"
homepage = "https://ferrotensor.dev"
authors = ["Yashaswin Sharma Puranik <puranikyashaswinsharma@gmail.com>"]
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
