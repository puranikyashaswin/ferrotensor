name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      # Hosted runners have no GPU: GPU tests are #[ignore]d and skipped here.
      - run: cargo test --workspace

  gpu-vulkan:
    name: GPU tests (software Vulkan)
    # Hosted runners have no GPU. Mesa's lavapipe implements Vulkan on the CPU,
    # so the GPU suites run here through the real wgpu Vulkan path: it checks
    # correctness, not speed.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WGPU_BACKEND: vulkan
      FERROTENSOR_RUN_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Mesa lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers vulkan-tools
      - run: vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Adapter and kernel self-check
        run: cargo run --release -p ferrotensor-cli -- info --check
      - name: GPU suites (ignored tests)
        run: cargo test --release --workspace -- --ignored --test-threads=1
      # A LoRA adapter trained here, exported with `export-adapter --format
      # peft`, must give the same logits in PyTorch + PEFT (CPU wheels).
      - name: PEFT export against PyTorch + PEFT
        run: |
          out="$RUNNER_TEMP/peft-check"
          venv="$RUNNER_TEMP/peft-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install -q --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          "$venv/bin/pip" install -q transformers==5.20.2 peft==0.21.2 safetensors==0.8.0
          cargo run --release -p ferrotensor-trainer --example peft_fixture -- "$out"
          cargo run --release -p ferrotensor-cli -- export-adapter \
            --lora "$out/adapter.safetensors" --model "$out/model" \
            --output "$out/peft" --format peft
          "$venv/bin/python" scripts/check_peft_export.py \
            --model "$out/model" --adapter "$out/peft" --logits "$out/logits.json"
      - name: Autograd finite-difference checks
        run: cargo test --release -p ferrotensor-autograd --test grad_check -- --test-threads=1
      - name: Tensor API GPU parity
        run: cargo test --release -p ferrotensor --lib -- --test-threads=1
      - name: Tensor API GPU parity with op fusion on
        run: cargo test --release -p ferrotensor --lib -- --test-threads=1
        env:
          FERROTENSOR_FUSION: "1"
      - name: Hardware report (quick)
        run: scripts/hardware-report.sh --quick
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: hardware-report-lavapipe
          path: reports/

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      # The CLI's binary is also named `ferrotensor`; documented in the same
      # cargo call as the library, both write target/doc/ferrotensor and the
      # job fails now and then with a missing file. Document it afterwards.
      - run: cargo doc --workspace --no-deps --exclude ferrotensor-cli
      - run: cargo doc -p ferrotensor-cli --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories licenses bans sources
