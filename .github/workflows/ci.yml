name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      # Hosted runners have no GPU: GPU tests are #[ignore]d and skipped here.
      - run: cargo test --workspace

  gpu-vulkan:
    name: GPU tests (software Vulkan)
    # Hosted runners have no GPU. Mesa's lavapipe implements Vulkan on the CPU,
    # so the GPU suites run here through the real wgpu Vulkan path: it checks
    # correctness, not speed.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WGPU_BACKEND: vulkan
      FERROTENSOR_RUN_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4.2.2
      # Lavapipe comes from apt, and the runner has no route to the Ubuntu
      # package hosts during an outage (every one of them failed to resolve for
      # about three hours once). So the .deb files, dependencies included, are
      # cached per runner image: a run with a cache hit installs them with dpkg
      # and downloads nothing. On a miss, scripts/ci/apt-install.sh retries and
      # falls back from the Azure mirror to archive.ubuntu.com, which covers one
      # bad mirror but not an outage of every host; a miss during such an outage
      # still fails. A cache saved on a PR branch is visible only to that PR, so
      # other PRs are protected once this workflow has run on main.
      - name: Runner image id
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Cache lavapipe packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/lavapipe-debs
          # Bump the v1 suffix to discard a bad cache entry.
          key: lavapipe-debs-v1-${{ steps.image.outputs.id }}
      - name: TEMP block Ubuntu package hosts
        run: |
          echo "127.0.0.1 azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com" | sudo tee -a /etc/hosts
          # apt-get update exits 0 when only some indexes fail, so look for the warning.
          sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=10 2>&1 | tee /tmp/apt-update.log || true
          if ! grep -q "Failed to fetch.*ubuntu" /tmp/apt-update.log; then
            echo "the Ubuntu hosts are still reachable, the block is not effective"
            exit 1
          fi
          echo "the Ubuntu package hosts are unreachable, as in an outage"
      - name: Install Mesa lavapipe
        run: scripts/ci/install-lavapipe.sh "$HOME/.cache/lavapipe-debs"
      # Diagnostic only; the self-check below decides whether an adapter works.
      - name: Vulkan devices
        run: |
          if command -v vulkaninfo >/dev/null; then
            vulkaninfo --summary
          else
            echo "vulkaninfo is not installed; skipping the summary"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Adapter and kernel self-check
        run: cargo run --release -p ferrotensor-cli -- info --check
      - name: GPU suites (ignored tests)
        run: cargo test --release --workspace -- --ignored --test-threads=1
      - name: Autograd finite-difference checks
        run: cargo test --release -p ferrotensor-autograd --test grad_check -- --test-threads=1
      - name: Tensor API GPU parity
        run: cargo test --release -p ferrotensor --lib -- --test-threads=1
      - name: Tensor API GPU parity with op fusion on
        run: cargo test --release -p ferrotensor --lib -- --test-threads=1
        env:
          FERROTENSOR_FUSION: "1"
      - name: Hardware report (quick)
        run: scripts/hardware-report.sh --quick
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: hardware-report-lavapipe
          path: reports/

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      # The CLI's binary is also named `ferrotensor`; documented in the same
      # cargo call as the library, both write target/doc/ferrotensor and the
      # job fails now and then with a missing file. Document it afterwards.
      - run: cargo doc --workspace --no-deps --exclude ferrotensor-cli
      - run: cargo doc -p ferrotensor-cli --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories licenses bans sources
