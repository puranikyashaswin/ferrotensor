name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal command or code snippet.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferrotensor version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, GPU and backend
      description: For example macOS 15 / Apple M2 / Metal, or Ubuntu 24.04 / RTX 3060 / Vulkan.
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Output of `ferrotensor info --check --json`
      description: Lists the GPUs wgpu sees, the one Ferrotensor uses, and whether its kernels pass on it. Leave empty if your version has no `info` command (see docs/testing-on-your-gpu.md).
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output with `RUST_BACKTRACE=1` if it panics.
      render: shell
