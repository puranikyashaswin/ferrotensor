[package]
name = "ferrotensor-graph"
version = "0.7.3"
edition = "2021"
description = "Neural network modules and transformer building blocks for Ferrotensor"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/ferrotensor-graph"
readme = "README.md"
keywords = ["neural-networks", "transformer", "machine-learning", "gpu", "llm"]
categories = ["science", "algorithms", "artificial-intelligence"]

[dependencies]
ferrotensor-backend = { path = "../ferrotensor-backend", version = "0.7.3" }
ferrotensor-autograd = { path = "../ferrotensor-autograd", version = "0.7.3" }
ferrotensor-loader = { path = "../ferrotensor-loader", version = "0.7.3" }
pollster = "0.3"
log = "0.4"
bytemuck = "1.14"

[dev-dependencies]
# The examples log through env_logger; the library only uses `log`.
env_logger = "0.11"
safetensors = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
half = "2"

[lints]
workspace = true
