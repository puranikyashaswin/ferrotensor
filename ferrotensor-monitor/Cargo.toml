[package]
name = "ferrotensor-monitor"
version = "0.7.2"
edition = "2021"
description = "Terminal dashboard for monitoring Ferrotensor training runs"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/ferrotensor-monitor"
readme = "README.md"
keywords = ["tui", "monitoring", "training", "machine-learning", "dashboard"]
categories = ["science"]

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
sysinfo = "0.33.1"
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.95"
rand = "0.9.2"
ferrotensor-trainer = { path = "../ferrotensor-trainer", version = "0.7.2" }

[lints]
workspace = true
