[package]
name = "ferrotensor-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for training and running models with Ferrotensor"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/puranikyashaswin/ferrotensor"
documentation = "https://docs.rs/ferrotensor-cli"
readme = "../README.md"
keywords = ["machine-learning", "cli", "lora", "llm", "gpu"]
categories = ["science"]


[[bin]]
name = "ferrotensor"
path = "src/main.rs"

[dependencies]
ferrotensor-backend = { path = "../ferrotensor-backend", version = "0.1.0" }
ferrotensor-graph = { path = "../ferrotensor-graph", version = "0.1.0" }
ferrotensor-loader = { path = "../ferrotensor-loader", version = "0.1.0" }
ferrotensor-autograd = { path = "../ferrotensor-autograd", version = "0.1.0" }
ferrotensor-trainer = { path = "../ferrotensor-trainer", version = "0.1.0" }
ferrotensor-monitor = { path = "../ferrotensor-monitor", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
pollster = "1.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

