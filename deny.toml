[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Both come in only through `tokenizers` (indicatif and
    # macro_rules_attribute); there is no maintained replacement upstream yet.
    { id = "RUSTSEC-2025-0119", reason = "number_prefix via tokenizers -> indicatif, no safe upgrade" },
    { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro) via tokenizers -> macro_rules_attribute, no safe upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
