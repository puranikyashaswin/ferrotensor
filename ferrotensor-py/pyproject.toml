[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ferrotensor"
dynamic = ["version"]
description = "PyTorch-style tensors, autograd and nn on wgpu (Metal, Vulkan, DX12) or the CPU, written in Rust"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Yashaswin Puranik", email = "puranikyashaswinsharma@gmail.com" }]
keywords = ["machine-learning", "deep-learning", "gpu", "autograd", "wgpu"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/puranikyashaswin/ferrotensor"
Repository = "https://github.com/puranikyashaswin/ferrotensor"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "ferrotensor._ferrotensor"
