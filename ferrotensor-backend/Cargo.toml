[package]
name = "ferrotensor-backend"
version = "0.1.0"
edition = "2021"
description = "wgpu compute backend with hand-written WGSL kernels for the Ferrotensor ML framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/puranikyashaswin/ferrotensor"
documentation = "https://docs.rs/ferrotensor-backend"
readme = "../README.md"
keywords = ["wgpu", "wgsl", "gpu", "tensor", "compute"]
categories = ["science", "algorithms"]

[dependencies]
wgpu = "0.19"
pollster = "1.0"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1.14", features = ["derive"] }
futures-intrusive = "0.5"


[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }
