[package]
name = "ferrotensor-backend"
version = "0.7.3"
edition = "2021"
description = "wgpu compute backend with hand-written WGSL kernels for the Ferrotensor ML framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/ferrotensor-backend"
readme = "README.md"
keywords = ["wgpu", "wgsl", "gpu", "tensor", "compute"]
categories = ["science", "algorithms"]

[dependencies]
wgpu = "=30.0.2"
half = "2"
pollster = "0.3"
log = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }


[dev-dependencies]
# The examples log through env_logger; the library only uses `log`.
env_logger = "0.11"
naga = { version = "=30.0.2", features = ["wgsl-in"] }

[lints]
workspace = true
