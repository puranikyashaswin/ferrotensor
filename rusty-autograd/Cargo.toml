[package]
name = "rusty-autograd"
version = "0.1.0"
edition = "2021"
description = "Reverse-mode automatic differentiation for the Rusty GPU ML framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/puranikyashaswin/rusty"
documentation = "https://docs.rs/rusty-autograd"
readme = "../README.md"
keywords = ["autograd", "automatic-differentiation", "machine-learning", "gpu", "wgpu"]
categories = ["science", "algorithms"]

[dependencies]
rusty-backend = { path = "../rusty-backend", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
pollster = "0.3"
