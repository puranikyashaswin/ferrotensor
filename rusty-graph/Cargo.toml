[package]
name = "rusty-graph"
version = "0.1.0"
edition = "2021"
description = "Neural network modules and transformer building blocks for Rusty"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/puranikyashaswin/rusty"
documentation = "https://docs.rs/rusty-graph"
readme = "../README.md"
keywords = ["neural-networks", "transformer", "machine-learning", "gpu", "llm"]
categories = ["science", "algorithms"]

[dependencies]
rusty-backend = { path = "../rusty-backend", version = "0.1.0" }
rusty-autograd = { path = "../rusty-autograd", version = "0.1.0" }
rusty-loader = { path = "../rusty-loader", version = "0.1.0" }
env_logger = "0.11"
pollster = "0.3"
log = "0.4"
bytemuck = "1.14"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
